<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Petete — Registre de Nou Compte (Web)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    body {
      background-color: #f4f6f8;
      color: #1a1a1a;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 36px 32px;
      border: 1px solid #e0e0e0;
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      background: #1976d2;
      color: #ffffff;
      border-radius: 12px;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(25, 118, 210, 0.3);
    }
    .title {
      font-size: 22px;
      font-weight: 600;
      color: #212121;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 14px;
      color: #666666;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #333333;
      margin-bottom: 6px;
    }
    .form-control {
      width: 100%;
      padding: 11px 14px;
      font-size: 14px;
      border: 1px solid #c4c4c4;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      background-color: #fff;
    }
    .form-control:focus {
      border-color: #1976d2;
      box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.15);
    }
    .select-control {
      width: 100%;
      padding: 11px 14px;
      font-size: 14px;
      border: 1px solid #c4c4c4;
      border-radius: 6px;
      outline: none;
      background-color: #fff;
      cursor: pointer;
    }
    .helper-text {
      font-size: 12px;
      color: #666;
      margin-top: 4px;
    }
    .btn-primary {
      width: 100%;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      background-color: #1976d2;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(25, 118, 210, 0.25);
      transition: background-color 0.2s, box-shadow 0.2s;
      margin-top: 10px;
    }
    .btn-primary:hover {
      background-color: #1565c0;
    }
    .footer-link {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
      color: #666666;
    }
    .footer-link a {
      color: #1976d2;
      text-decoration: none;
      font-weight: 500;
    }

    /* Error alert showcase */
    .alert-section {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px dashed #d0d0d0;
    }
    .alert-section-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #757575;
      margin-bottom: 10px;
    }
    .alert-error {
      background-color: #fdeded;
      color: #5f2120;
      border: 1px solid #f5c2c7;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="logo-badge">P</div>
      <h1 class="title">Crear un Compte</h1>
      <p class="subtitle">Comença a gestionar els teus clients i activitats</p>
    </div>

    <!-- Happy Path Form -->
    <form onsubmit="return false;">
      <div class="form-group">
        <label class="form-label" for="nom">Nom complet</label>
        <input type="text" id="nom" class="form-control" placeholder="Eric Zapater" value="Eric Zapater">
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Correu electrònic</label>
        <input type="email" id="email" class="form-control" placeholder="em@empresa.com" value="eric.zapater@company.com">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Contrasenya</label>
        <input type="password" id="password" class="form-control" placeholder="Mínim 8 caràcters" value="PasswordSegur2026!">
        <div class="helper-text">Mínim 8 caràcters recomanant combinació de lletres i números.</div>
      </div>

      <div class="form-group">
        <label class="form-label" for="idioma">Idioma de la interfície</label>
        <select id="idioma" class="select-control">
          <option value="ca" selected>Català</option>
          <option value="es">Castellà (Español)</option>
          <option value="en">Anglès (English)</option>
        </select>
      </div>

      <button type="submit" class="btn-primary">Completar Registre</button>
    </form>

    <div class="footer-link">
      Ja tens compte? <a href="login-web.html">Inicia sessió</a>
    </div>

    <!-- Error State Showcase -->
    <div class="alert-section">
      <div class="alert-section-title">Estat d'Error: Email existent (Simulat)</div>
      <div class="alert-error">
        <span>⚠</span>
        <span>Aquest correu electrònic ja està registrat. Utilitza la pantalla d'inici de sessió.</span>
      </div>
    </div>
  </div>

</body>
</html>
