<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Petete — Iniciar Sessió (Web)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    body {
      background-color: #f4f6f8;
      color: #1a1a1a;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 40px 32px;
      border: 1px solid #e0e0e0;
    }
    .header {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      background: #1976d2;
      color: #ffffff;
      border-radius: 12px;
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(25, 118, 210, 0.3);
    }
    .title {
      font-size: 24px;
      font-weight: 600;
      color: #212121;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 14px;
      color: #666666;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #333333;
      margin-bottom: 6px;
    }
    .form-control {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      border: 1px solid #c4c4c4;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      background-color: #fff;
    }
    .form-control:focus {
      border-color: #1976d2;
      box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.15);
    }
    .btn-primary {
      width: 100%;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      background-color: #1976d2;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(25, 118, 210, 0.25);
      transition: background-color 0.2s, box-shadow 0.2s;
      margin-top: 8px;
    }
    .btn-primary:hover {
      background-color: #1565c0;
      box-shadow: 0 4px 10px rgba(25, 118, 210, 0.35);
    }
    .footer-link {
      margin-top: 24px;
      text-align: center;
      font-size: 14px;
      color: #666666;
    }
    .footer-link a {
      color: #1976d2;
      text-decoration: none;
      font-weight: 500;
    }
    .footer-link a:hover {
      text-decoration: underline;
    }

    /* Error Alert Preview */
    .alert-section {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px dashed #d0d0d0;
    }
    .alert-section-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #757575;
      margin-bottom: 12px;
    }
    .alert {
      padding: 12px 14px;
      border-radius: 6px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .alert-error {
      background-color: #fdeded;
      color: #5f2120;
      border: 1px solid #f5c2c7;
    }
    .alert-icon {
      font-weight: 700;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="logo-badge">P</div>
      <h1 class="title">Petete</h1>
      <p class="subtitle">Engagement Manager Daily Tracking</p>
    </div>

    <!-- Happy Path Form -->
    <form onsubmit="return false;">
      <div class="form-group">
        <label class="form-label" for="email">Correu electrònic</label>
        <input type="email" id="email" class="form-control" placeholder="em@empresa.com" value="eric.em@company.com">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Contrasenya</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" value="Secret1234">
      </div>

      <button type="submit" class="btn-primary">Iniciar Sessió</button>
    </form>

    <div class="footer-link">
      No tens compte? <a href="register-web.html">Registra't aquí</a>
    </div>

    <!-- Error State Showcase -->
    <div class="alert-section">
      <div class="alert-section-title">Estat d'Error (Simulat)</div>
      <div class="alert alert-error">
        <span class="alert-icon">⚠</span>
        <span>Credencials incorrectes. Revisa el correu i la contrasenya.</span>
      </div>
    </div>
  </div>

</body>
</html>
